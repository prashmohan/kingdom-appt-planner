<!DOCTYPE html>
<html lang="{{ current_lang }}" dir="{{ text_dir }}" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('sub_success_page_title') }}</title>
    {% include 'analytics.html' %}
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <script src="{{ url_for('static', filename='tailwind.js') }}"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'kvk-gold': '#FBBF24',
                        'kvk-gray': {
                            700: '#374151',
                            800: '#1F2937',
                            900: '#111827',
                        },
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-kvk-gray-900 text-gray-200 antialiased">
    <div class="container mx-auto p-4 md:p-8 max-w-4xl">
        {% include 'partials/_i18n_bar.html' %}
        <div class="bg-kvk-gray-800 p-6 rounded-xl shadow-lg border border-kvk-gray-700 text-center">
            <h1 class="text-3xl font-bold mb-4 text-green-400">{{ t('sub_success_heading') }}</h1>
            <p class="mb-6 text-gray-300">{{ t('sub_success_message') }}</p>
            <a href="{{ url_for('public.index') }}" class="text-kvk-gold hover:underline">{{ t('sub_success_home_link') }}</a>
        </div>
    </div>
</body>
</html>
